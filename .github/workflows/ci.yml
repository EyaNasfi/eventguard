name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest + coverage
        run: >-
          pytest --cov=eventsim --cov=gateway --cov=config
          --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  gitleaks:  # SR-13
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # on pull_request events the action lists the PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lab:  # P0 exit criterion: compose starts EventSim and the reference script duplicates an edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
      - run: pip install -e .
      - name: reference duplication 2026 -> 2027
        run: |
          set -a; . ./.env; set +a
          python -m eventsim.reference --source 2026 --target 2027 | tee report.json
          python -c "import json; r = json.load(open('report.json')); assert len(r['events']) == 10, r"
      - name: gateway over MCP inside the Docker network (S1-02)
        run: |
          docker compose exec -T gateway python - < scripts/gateway_probe.py | tee probe.txt
          grep -q "env has EVENTSIM_TEST_TOKEN: False" probe.txt
          grep -q "env has GEMINI_API_KEY: False" probe.txt
          grep -q "no bearer -> 401" probe.txt
          grep -q "EventSim admin token as bearer -> 401" probe.txt
          grep -q "27 tools" probe.txt
          grep -q "\[reader\] create_event -> is_error=True: EventSim answered HTTP 403" probe.txt
          test "$(grep -c 'raw_api_call .* -> is_error=True: refused by the gateway' probe.txt)" -eq 4
          grep -q "\[editor\] create_event -> is_error=False" probe.txt
          test -z "$(docker compose port gateway 8100)"
      - if: always()
        run: docker compose logs eventsim gateway
