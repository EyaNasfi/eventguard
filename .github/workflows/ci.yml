name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest + coverage
        run: pytest --cov=eventsim --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  web:  # front end: install, typecheck, lint, build (mock mode; no tokens in CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: no test-endpoint strings in the bundle
        run: "! grep -rl -e '_test' -e 'TEST_TOKEN' dist"

  gitleaks:  # SR-13
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # on pull_request events the action lists the PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lab:  # P0 exit criterion: compose starts EventSim and the reference script duplicates an edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
      - run: pip install -e .
      - name: reference duplication 2026 -> 2027
        run: |
          set -a; . ./.env; set +a
          python -m eventsim.reference --source 2026 --target 2027 | tee report.json
          python -c "import json; r = json.load(open('report.json')); assert len(r['events']) == 10, r"
      - if: always()
        run: docker compose logs eventsim
