# EventGuard lab. Nothing here publishes a port to the host except n8n (127.0.0.1:5678).
# Debug access to EventSim from the host: add -f docker-compose.dev.yml (binds 127.0.0.1 only).
#
# Each service gets an explicit list of variables (interpolated from .env), not the whole file:
# EventSim never sees the Gemini key; the gateway never sees the Gemini key or the test token.
# The Gemini key goes only to n8n (chat model) and the retriever (embeddings).
name: eventguard

services:
  eventsim:
    build:
      context: .
      dockerfile: eventsim/Dockerfile
    environment:
      EVENTSIM_TOKEN_READER: ${EVENTSIM_TOKEN_READER:?set in .env}
      EVENTSIM_TOKEN_EDITOR: ${EVENTSIM_TOKEN_EDITOR:?set in .env}
      EVENTSIM_TOKEN_ADMIN: ${EVENTSIM_TOKEN_ADMIN:?set in .env}
      EVENTSIM_TEST_TOKEN: ${EVENTSIM_TEST_TOKEN:?set in .env}
      EVENTSIM_TEST_ENDPOINTS: ${EVENTSIM_TEST_ENDPOINTS:-false}
      EVENTSIM_DEFAULT_SEED: ${EVENTSIM_DEFAULT_SEED:-42}
    volumes:
      - eventsim_data:/data
    networks:
      - lab_internal
    restart: unless-stopped

  # Vector store for the procedure sheets (S2-03). Internal network only, no host port.
  vectorstore:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    volumes:
      - chroma_data:/data
    networks:
      - lab_internal
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Embeds queries and searches the vector store for the gateway's search_procedures (S2-03).
  # It holds the Gemini key and has internet access (egress), so the gateway needs neither.
  # Ingest the sheets with: docker compose exec retriever python -m agent.rag.ingest
  retriever:
    build:
      context: .
      dockerfile: agent/rag/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      CHROMA_URL: http://vectorstore:8000
    depends_on:
      vectorstore:
        condition: service_healthy
    networks:
      - lab_internal
      - egress
    restart: unless-stopped

  # The only path from the agent to EventSim (FR-GW-01). MCP over Streamable HTTP at
  # http://gateway:8100/mcp, internal network only (SR-14): no port is published, not even in dev.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      EVENTSIM_URL: http://eventsim:8000
      EVENTSIM_TOKEN_READER: ${EVENTSIM_TOKEN_READER:?set in .env}
      EVENTSIM_TOKEN_EDITOR: ${EVENTSIM_TOKEN_EDITOR:?set in .env}
      EVENTSIM_TOKEN_ADMIN: ${EVENTSIM_TOKEN_ADMIN:?set in .env}
      GATEWAY_TOKEN_READER: ${GATEWAY_TOKEN_READER:?set in .env}
      GATEWAY_TOKEN_EDITOR: ${GATEWAY_TOKEN_EDITOR:?set in .env}
      GATEWAY_TOKEN_ADMIN: ${GATEWAY_TOKEN_ADMIN:?set in .env}
      EVENTGUARD_CONFIG: ${EVENTGUARD_CONFIG:?set in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:?set in .env}  # part of the config hash, not a secret
      RETRIEVER_URL: http://retriever:8200
      GATEWAY_TOOL_LOG: /logs/tool_calls.jsonl  # S2-05; host folder ./logs (gitignored)
      EVENTGUARD_GIT_COMMIT: ${EVENTGUARD_GIT_COMMIT:-unknown}  # set by scripts/lab-up.ps1
    volumes:
      - ./logs:/logs
    depends_on:
      eventsim:
        condition: service_healthy
      retriever:
        condition: service_healthy
    networks:
      - lab_internal
    restart: unless-stopped

  # The chat and agent runtime (S2-02, FR-AGT-01). The only service published to the host, on
  # loopback only. It joins lab_internal to reach the gateway and `egress` to reach the Gemini API.
  # It holds the gateway bearer tokens (as encrypted n8n credentials) and never an EventSim token.
  n8n:
    image: n8nio/n8n:2.47.5@sha256:e29e9cc965a16d07d989f115f729f8a1c7aff58688d4850247fa495d4d7aae2f
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"  # plain HTTP on loopback only
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lab_internal
      - egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  # No route to the internet or the host. Services that need Gemini (n8n) also join a second network.
  lab_internal:
    internal: true
  # Internet access for n8n only (Gemini API). EventSim and the gateway are not on it.
  egress: {}

volumes:
  eventsim_data:
  chroma_data:
  n8n_data:
