# EventGuard lab. Nothing here publishes a port to the host except, later, n8n.
# Debug access to EventSim from the host: add -f docker-compose.dev.yml (binds 127.0.0.1 only).
name: eventguard

services:
  eventsim:
    build:
      context: .
      dockerfile: eventsim/Dockerfile
    env_file: .env
    volumes:
      - eventsim_data:/data
    networks:
      - lab_internal
    restart: unless-stopped

networks:
  # No route to the internet or the host. Services that need Gemini (n8n) also join a second network.
  lab_internal:
    internal: true

volumes:
  eventsim_data:
