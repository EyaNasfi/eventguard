# Install once Git exists:  .venv\Scripts\pre-commit install
# gitleaks runs from the locally installed binary (winget Gitleaks.Gitleaks, 8.30.1, see
# docs/environment.md) instead of the upstream hook, which builds gitleaks from source and
# downloads a Go toolchain first. CI still runs gitleaks-action on every push (SR-13).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
